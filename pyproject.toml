[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrecycle-analytics"
version = "0.1.0"
description = "Py-GC/MS deconvolution and inverse polymer analytics for post-consumer recyclates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PyRecycle-Analytics Team" }]
keywords = [
    "pyrolysis-gc-ms",
    "chemometrics",
    "mcr-als",
    "polymer-recycling",
    "deconvolution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Raw-data ingestion for vendor-neutral MS formats (mzML / mzXML / mzData).
# ANDI-MS (.CDF) is read through scipy.io.netcdf_file and needs no extra package.
io = ["pyopenms>=3.0"]
# python-multipart is what parses the upload body; without it POST /samples fails
# at request time, not at import time, so it belongs in the extra rather than in
# a note somewhere.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pyrecycle-analytics[db]",
]
db = ["SQLAlchemy>=2.0", "alembic>=1.13"]
report = ["weasyprint>=61"]
ui = ["streamlit>=1.33", "plotly>=5.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = [
    "pyrecycle-analytics[io,api,db,report,ui,dev]",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pyrecycle_analytics*", "data_schemas*"]

[tool.pytest.ini_options]
minversion = "8.0"
# Keep `src/` (implementation) and the repository root (`data_schemas`, `tests`)
# importable without requiring an editable install.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that build large synthetic data cubes",
    "requires_pyopenms: tests that need the optional pyopenms dependency",
]
filterwarnings = [
    "error::DeprecationWarning:pyrecycle_analytics.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "NPY"]
ignore = ["N803", "N806"]  # capital matrix names (C, S, D) are chemometrics convention

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["pyrecycle_analytics", "data_schemas"]
# An editable install points at src/ through a finder hook that mypy does not
# follow, so a bare `mypy` cannot locate the package without this.
mypy_path = "src"
# Without this, mypy treats every Pydantic field as a required constructor
# argument and reports a false error at every model instantiation.
plugins = ["pydantic.mypy"]
